<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" width="920" height="570" role="img" aria-labelledby="t d">
  <title id="t">What an AI agent is made of</title>
  <desc id="d">Inside a control loop, instructions and goals feed a model that reasons and decides; the model reads and writes memory and state and calls tools and actions, which reach outside systems, data and people. The loop escalates to a person in charge, who approves irreversible actions and can stop it. Each part is labeled with the sections of the page that govern it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .h { font-size: 21px; font-weight: 700; }
    .s { font-size: 13px; fill: #8b949e; }
    .b { font-size: 15px; font-weight: 700; }
    .m { font-size: 12px; fill: #8b949e; }
    .g { font-size: 11.5px; fill: #3fb9b0; font-weight: 600; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .core { fill: #13262a; stroke: #3fb9b0; stroke-width: 2; }
    .person { fill: #2a2110; stroke: #e3b341; stroke-width: 2; }
    .ln { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  </style>
  <rect x="0" y="0" width="920" height="570" rx="16" fill="#0d1117"/>
  <text class="h" x="36" y="44">What an AI agent is made of</text>
  <text class="s" x="36" y="68">Each part, with the sections of this page that govern it</text>

  <!-- control loop -->
  <rect x="142" y="92" width="630" height="338" rx="26" fill="none" stroke="#3fb9b0" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="b" x="455" y="368" text-anchor="middle">Control loop</text>
  <text class="m" x="455" y="388" text-anchor="middle">observe, plan, act, check the result, repeat</text>
  <text class="g" x="455" y="408" text-anchor="middle">Timeliness · Cost · Change, monitoring and incidents</text>

  <!-- instructions -->
  <rect class="box" x="335" y="116" width="240" height="78" rx="10"/>
  <text class="b" x="455" y="142" text-anchor="middle">Instructions and goals</text>
  <text class="m" x="455" y="161" text-anchor="middle">role, rules, limits, what done means</text>
  <text class="g" x="455" y="181" text-anchor="middle">Defined outcomes · Risk</text>

  <!-- model -->
  <rect class="core" x="335" y="228" width="240" height="88" rx="10"/>
  <text class="b" x="455" y="256" text-anchor="middle">Model</text>
  <text class="m" x="455" y="275" text-anchor="middle">reasons and decides the next step</text>
  <text class="g" x="455" y="298" text-anchor="middle">Explainability and traceability</text>

  <!-- memory -->
  <rect class="box" x="160" y="228" width="152" height="88" rx="10"/>
  <text class="b" x="236" y="254" text-anchor="middle">Memory and state</text>
  <text class="m" x="236" y="273" text-anchor="middle">this run's context,</text>
  <text class="m" x="236" y="288" text-anchor="middle">records kept over time</text>
  <text class="g" x="236" y="306" text-anchor="middle">Privacy and data</text>

  <!-- tools -->
  <rect class="box" x="598" y="228" width="152" height="88" rx="10"/>
  <text class="b" x="674" y="254" text-anchor="middle">Tools and actions</text>
  <text class="m" x="674" y="273" text-anchor="middle">APIs, search, files,</text>
  <text class="m" x="674" y="288" text-anchor="middle">databases, code</text>
  <text class="g" x="674" y="306" text-anchor="middle">Security · Human control</text>

  <!-- outside world -->
  <rect class="box" x="790" y="222" width="118" height="100" rx="10" stroke-dasharray="4 4"/>
  <text class="b" x="849" y="250" text-anchor="middle">Outside world</text>
  <text class="m" x="849" y="270" text-anchor="middle">systems, data,</text>
  <text class="m" x="849" y="285" text-anchor="middle">customers</text>
  <text class="g" x="849" y="306" text-anchor="middle">effects are real</text>

  <!-- person -->
  <rect class="person" x="285" y="466" width="340" height="84" rx="10"/>
  <text class="b" x="455" y="492" text-anchor="middle">Person in charge</text>
  <text class="m" x="455" y="511" text-anchor="middle">owns it, approves what cannot be undone, can stop it</text>
  <text class="g" x="455" y="533" text-anchor="middle">Human control and accountability · People</text>

  <!-- arrows -->
  <line class="ln" x1="455" y1="194" x2="455" y2="226" marker-end="url(#a)"/>
  <line class="ln" x1="333" y1="272" x2="314" y2="272" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="ln" x1="577" y1="272" x2="596" y2="272" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="ln" x1="752" y1="272" x2="788" y2="272" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="455" y1="432" x2="455" y2="464" stroke="#e3b341" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#p)" marker-end="url(#p)"/>
  <text class="m" x="467" y="452">escalation and approval</text>
</svg>
